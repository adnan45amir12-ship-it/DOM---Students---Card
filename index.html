<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #ffffff;
        }

        .navbar-custom {
            background-color: #212529;
        }

        .navbar-brand {
            color: white !important;
        }

        .student-card {
            border: 1px solid #d5d5d5;
            border-radius: 0;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .student-image {
            width: 100%;
            height: 225px;
            object-fit: cover;
            background-color: #f8f9fa;
        }

        .student-card-body {
            background-color: #212529;
            color: white;
        }

        .student-card-body h5 {
            margin-bottom: 5px;
        }

        .show-skills {
            color: #0d6efd;
            text-decoration: underline;
            cursor: pointer;
        }

        .page-title {
            font-weight: 600;
        }

        .filter-btn {
            padding: 9px 16px;
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                Navbar
            </a>
        </div>
    </nav>


    <!-- ================= STUDENTS SECTION ================= -->

    <main class="container mt-4">

        <!-- Heading + Filter -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1 class="page-title mb-0">
                Students
            </h1>

            <button
                class="btn btn-dark filter-btn"
                id="filterBtn"
            >
                Filter
            </button>

        </div>


        <!-- Students will be generated by JavaScript -->
        <div
            class="row g-4"
            id="studentsContainer"
        ></div>

    </main>


    <!-- ================= BOOTSTRAP MODAL ================= -->

    <div
        class="modal fade"
        id="skillsModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="skillsModalTitle"
                    >
                        Student Skills
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div class="modal-body">

                    <div id="skillsModalBody"></div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-dark"
                        data-bs-dismiss="modal"
                    >
                        Close
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // Students Data
        const students = [

            {
                name: "M. Ali Khan",
                batch: "21",
                image: "https://i.pravatar.cc/500?img=12",
                skills: [
                    "HTML",
                    "CSS",
                    "JavaScript"
                ]
            },

            {
                name: "Ahmed Raza",
                batch: "21",
                image: "https://i.pravatar.cc/500?img=13",
                skills: [
                    "HTML",
                    "Bootstrap",
                    "JavaScript"
                ]
            },

            {
                name: "Hamza Ali",
                batch: "22",
                image: "https://i.pravatar.cc/500?img=14",
                skills: [
                    "HTML",
                    "CSS",
                    "Bootstrap"
                ]
            },

            {
                name: "Usman Khan",
                batch: "22",
                image: "https://i.pravatar.cc/500?img=15",
                skills: [
                    "JavaScript",
                    "DOM",
                    "GitHub"
                ]
            },

            {
                name: "Ahsan Ahmed",
                batch: "22",
                image: "https://i.pravatar.cc/500?img=16",
                skills: [
                    "HTML",
                    "CSS",
                    "JavaScript"
                ]
            },

            {
                name: "Bilal Khan",
                batch: "23",
                image: "https://i.pravatar.cc/500?img=17",
                skills: [
                    "Bootstrap",
                    "JavaScript",
                    "Git"
                ]
            },

            {
                name: "Saad Ali",
                batch: "23",
                image: "https://i.pravatar.cc/500?img=18",
                skills: [
                    "HTML",
                    "CSS"
                ]
            },

            {
                name: "Zain Ahmed",
                batch: "23",
                image: "https://i.pravatar.cc/500?img=19",
                skills: [
                    "JavaScript",
                    "DOM",
                    "Bootstrap"
                ]
            }

        ];


        // Get Students Container
        const studentsContainer =
            document.getElementById("studentsContainer");


        // Function to Display Students
        function displayStudents(studentList) {

            // Clear previous cards
            studentsContainer.innerHTML = "";


            // Check if students are available
            if (studentList.length === 0) {

                studentsContainer.innerHTML = `
                    <div class="col-12 text-center">
                        <div class="alert alert-warning">
                            No students found.
                        </div>
                    </div>
                `;

                return;
            }


            // Loop through students
            studentList.forEach(function(student, index) {

                // Create Card
                const studentCard = document.createElement("div");

                studentCard.className =
                    "col-12 col-sm-6 col-lg-3";


                studentCard.innerHTML = `

                    <div class="card student-card h-100">

                        <!-- Student Image -->
                        <img
                            src="${student.image}"
                            class="card-img-top student-image"
                            alt="${student.name}"
                        >


                        <!-- Card Body -->
                        <div class="card-body student-card-body">

                            <h5>
                                ${student.name}
                            </h5>

                            <p class="mb-2">
                                Batch#${student.batch}
                            </p>

                            <a
                                href="#"
                                class="show-skills"
                                data-index="${index}"
                            >
                                Show skills
                            </a>

                        </div>

                    </div>

                `;


                // Add card to container
                studentsContainer.appendChild(studentCard);

            });


            // Add Click Event to Show Skills
            document.querySelectorAll(".show-skills")
                .forEach(function(link) {

                    link.addEventListener("click", function(event) {

                        event.preventDefault();


                        const studentIndex =
                            this.getAttribute("data-index");


                        const selectedStudent =
                            studentList[studentIndex];


                        // Modal Title
                        document.getElementById(
                            "skillsModalTitle"
                        ).innerText =
                            selectedStudent.name + " - Skills";


                        // Create Skills HTML
                        let skillsHTML = "<ul class='list-group'>";


                        selectedStudent.skills.forEach(function(skill) {

                            skillsHTML += `
                                <li class="list-group-item">
                                    ${skill}
                                </li>
                            `;

                        });


                        skillsHTML += "</ul>";


                        // Put Skills inside Modal
                        document.getElementById(
                            "skillsModalBody"
                        ).innerHTML = skillsHTML;


                        // Open Bootstrap Modal
                        const skillsModal =
                            new bootstrap.Modal(
                                document.getElementById("skillsModal")
                            );


                        skillsModal.show();

                    });

                });

        }


        // ================= INITIAL DISPLAY =================

        displayStudents(students);


        // ================= FILTER =================

        let isFiltered = false;


        document
            .getElementById("filterBtn")
            .addEventListener("click", function() {

                if (!isFiltered) {

                    // Show only JavaScript students
                    const filteredStudents =
                        students.filter(function(student) {

                            return student.skills.includes("JavaScript");

                        });


                    displayStudents(filteredStudents);

                    this.innerText = "Show All";

                    isFiltered = true;

                } else {

                    // Show all students
                    displayStudents(students);

                    this.innerText = "Filter";

                    isFiltered = false;

                }

            });

    </script>

</body>

</html>
